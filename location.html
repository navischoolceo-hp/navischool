  <style>
    /* ── RESET & LAYOUT ── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Pretendard', sans-serif;
      background: #111;
      color: #fff;
      overflow-x: hidden
    }

    .container {
      display: flex
    }

    #main {
      flex: 1;
      position: relative;
      overflow: hidden
    }

    #visualTransWrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5
    }

    /* ── SWIPER & BG ── */
    .mv_container {
      width: 100%;
      height: 90vh;
      position: relative
    }

    .swiper-container,
    .swiper-wrapper,
    .swiper-slide {
      width: 100%;
      height: 100%
    }

    .bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 6s ease;
      filter: brightness(0.5)
    }

    .swiper-slide-active .bg {
      transform: scale(1.12)
    }

    .bg1 {
      background-image: url('./img/navi/ph.svg')
    }

    .bg2 {
      background-image: url('./img/navi/ph.svg')
    }

    .bg3 {
      background-image: url('./img/navi/ph.svg')
    }

    .bg4 {
      background-image: url('./img/navi/ph.svg')
    }

    /* ── TEXT & BUTTON ── */
    .mv_txt_box {
      position: absolute;
      top: 20%;
      left: 5%;
      max-width: 640px;
      z-index: 2
    }

    .mv_cate {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #ffeb55;
      display: inline-block
    }

    .mv_tit {
      font-size: 43px;
      line-height: 1.4;
      margin: 0 0 12px
    }

    @media screen and (max-width:620px) {
      .mv_tit {
        font-size: 34px !important;
      }
    }

    @media screen and (max-width:500px) {
      .mv_tit {
        font-size: 26px !important;
      }
    }

    .mv_txt {
      font-size: 18px;
      line-height: 1.6;
      font-weight: 300
    }

    .mv_btn {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 36px;
      border: 2px solid #fff;
      border-radius: 40px;
      background: transparent;
      color: #fff;
      font-weight: 600;
      letter-spacing: .3px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .6s, background .35s, box-shadow .35s, color .35s, transform .35s;
      position: relative;
      overflow: hidden;
      text-decoration: none;
    }

    .swiper-slide-active .mv_btn {
      opacity: 1;
      pointer-events: auto
    }

    .mv_btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, .15);
      transform: translateX(-100%);
      transition: transform .4s;
    }

    .mv_btn:hover::after {
      transform: translateX(0)
    }

    .mv_btn:hover {
      background: #fff;
      color: #111;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
      transform: translateY(-2px);
    }

    /* ── WAVE ANIMATION ── */
    .wave_anim .wave {
      display: inline-block;
      opacity: 0;
      animation: wave 1.1s ease-out forwards
    }

    @keyframes wave {
      0% {
        transform: translateY(25px);
        opacity: 0
      }

      100% {
        transform: translateY(0);
        opacity: 1
      }
    }

    .wave_anim.custom .wave:nth-child(1) {
      animation-delay: .15s
    }

    .wave_anim.custom .wave:nth-child(2) {
      animation-delay: .3s
    }

    .wave_anim.custom .wave:nth-child(3) {
      animation-delay: .45s
    }

    /* ── PROGRESS BAR ── */
    .progress-container {
      position: absolute;
      bottom: 80px;
      left: 5%;
      right: 5%;
      height: 4px;
      display: flex;
      gap: 10px;
      z-index: 3;
      width: 150px;
    }

    .progress-segment {
      flex: 1;
      background: rgba(255, 255, 255, .25);
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: #fff;
      display: block
    }

    .wheel_down {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      opacity: .7;
      z-index: 3;
      animation: wheel-bounce 2s ease-in-out infinite;
    }

    .wheel_down .wheel {
      animation: wheel-fade 2s ease-in-out infinite;
    }

    @keyframes wheel-fade {
      0% {
        opacity: 1;
        transform: translateY(0)
      }

      80% {
        opacity: .2;
        transform: translateY(10px)
      }

      100% {
        opacity: 0;
        transform: translateY(14px)
      }
    }

    #sidebar {
      display: none
    }
  </style>

    }

      }

        font-size: 1rem
      }

      #visual-section .video_wrap video {
        object-position: right center
      }

    <style>
      /* ───────────────────────────────────────────────
     공통 · 레이아웃
  ───────────────────────────────────────────────*/
      .sub-visual__wrap {
        position: relative;
        z-index: 2;
        height: 80vh;
        width: 100%;
        background-size: cover !important;
        background-position: center top !important;
        overflow: hidden;
        perspective: 900px;
        --reveal-dur: 900ms;
      }

      .sub-visual__wrap.visual-01 {
        background: url(./img/navi/ph.svg) no-repeat center top;
      }

      .sub-visual__wrap[class*="visual"]::before {
        z-index: 1;
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(110deg, rgba(18, 22, 34, .56)45%, rgba(28, 33, 54, .34)100%);
        pointer-events: none;
        transition: background .8s;
      }

      /* ▼ 중앙에서 바깥쪽으로 '열리며' 배경이 나타나는 리빌 패널 */
      .sub-visual__wrap .reveal {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        background: #0b0d12;
        z-index: 0;
        transform: translateX(0);
        will-change: transform;
      }

      .sub-visual__wrap .reveal.l {
        left: 0;
      }

      .sub-visual__wrap .reveal.r {
        right: 0;
      }

      .sub-visual__wrap.play .reveal.l {
        animation: revealOutL var(--reveal-dur) cubic-bezier(.22, .8, .18, 1) forwards;
      }

      .sub-visual__wrap.play .reveal.r {
        animation: revealOutR var(--reveal-dur) cubic-bezier(.22, .8, .18, 1) forwards;
      }

      @keyframes revealOutL {
        to {
          transform: translateX(-100%);
        }
      }

      @keyframes revealOutR {
        to {
          transform: translateX(100%);

    <script>
      /* ───── 애니메이션 + 패럴럭스 + 브레드크럼 정렬 ───── */
      document.addEventListener('DOMContentLoaded', () => {
        const titleBox = document.querySelector('.sub-visual__title');
        const breadcrumb = document.querySelector('.breadcrumb-nav');
        const visual = document.querySelector('.sub-visual__wrap.visual-01');

        // ① 배경 양갈래 리빌 시작(중앙 → 바깥)
        visual.classList.add('play');

        // 리빌 길이( CSS 변수 --reveal-dur )를 읽어서 동기화
        const dur = parseInt(getComputedStyle(visual).getPropertyValue('--reveal-dur')) || 900;

        // ② 리빌 종료 후 텍스트 등장
        setTimeout(() => {
          titleBox.classList.add('in');
          breadcrumb.classList.add('in');
          alignBreadcrumb();
        }, dur + 40);

        // ③ 스크롤 패럴럭스
        window.addEventListener('scroll', () => {
          const scrolled = window.scrollY || window.pageYOffset;
          if (visual) {
            visual.style.backgroundPosition = `center ${Math.max(0, -scrolled * 0.15)}px`;
          }
        });

        // ④ 브레드크럼을 타이틀 바로 위에 놓음
        function alignBreadcrumb() {
          const areaRect = document.querySelector('.sub-visual__area').getBoundingClientRect();
          const wrapRect = visual.getBoundingClientRect();
          const nav = breadcrumb;
          const gap = 12;
          nav.style.bottom = (wrapRect.bottom - areaRect.top + gap * -1) + 'px';
        }
        window.addEventListener('resize', alignBreadcrumb);
      });
    </script>

      function forceKakaoMapLayout() {
        const mapBox = document.querySelector('#kakaoDirectionsSection .kd-map');
        const root = document.getElementById('daumRoughmapContainer1773101240693');
        if (!mapBox || !root) return;

        const h = Math.max(mapBox.clientHeight, window.innerWidth <= 768 ? 300 : 340);

        root.style.width = '100%';
        root.style.height = h + 'px';

        const wrapMap = root.querySelector('.wrap_map');
        if (wrapMap) {
          wrapMap.style.width = '100%';
          wrapMap.style.height = h + 'px';

        if (iframe) {
          iframe.style.width = '100%';
          iframe.style.height = h + 'px';
          iframe.setAttribute('scrolling', 'no');
        }

        }).render();
