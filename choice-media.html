  <style>
    /* ── RESET & LAYOUT ── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Pretendard', sans-serif;
      background: #1f554b;
      color: #fff;
      overflow-x: hidden
    }

    .container {
      display: flex
    }

    #main {
      flex: 1;
      position: relative;
      overflow: hidden
    }

    #visualTransWrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5
    }

    /* ── SWIPER & BG ── */
    .mv_container {
      width: 100%;
      height: 90vh;
      position: relative
    }

    .swiper-container,
    .swiper-wrapper,
    .swiper-slide {
      width: 100%;
      height: 100%
    }

    .bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 6s ease;
      filter: brightness(0.5)
    }

    .swiper-slide-active .bg {
      transform: scale(1.12)
    }

    .bg1 {
      background-image: url('./img/navi/ph.svg')
    }

    .bg2 {
      background-image: url('./img/navi/ph.svg')
    }

    .bg3 {
      background-image: url('./img/navi/ph.svg')
    }

    .bg4 {
      background-image: url('./img/navi/ph.svg')
    }

    /* ── TEXT & BUTTON ── */
    .mv_txt_box {
      position: absolute;
      top: 20%;
      left: 5%;
      max-width: 640px;
      z-index: 2
    }

    .mv_cate {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #ffeb55;
      display: inline-block
    }

    .mv_tit {
      font-size: 43px;
      line-height: 1.4;
      margin: 0 0 12px
    }

    @media screen and (max-width:620px) {
      .mv_tit {
        font-size: 34px !important;
      }
    }

    @media screen and (max-width:500px) {
      .mv_tit {
        font-size: 26px !important;
      }
    }

    .mv_txt {
      font-size: 18px;
      line-height: 1.6;
      font-weight: 300
    }

    .mv_btn {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 36px;
      border: 2px solid #fff;
      border-radius: 40px;
      background: transparent;
      color: #fff;
      font-weight: 600;
      letter-spacing: .3px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .6s, background .35s, box-shadow .35s, color .35s, transform .35s;
      position: relative;
      overflow: hidden;
      text-decoration: none;
    }

    .swiper-slide-active .mv_btn {
      opacity: 1;
      pointer-events: auto
    }

    .mv_btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, .15);
      transform: translateX(-100%);
      transition: transform .4s;
    }

    .mv_btn:hover::after {
      transform: translateX(0)
    }

    .mv_btn:hover {
      background: #fff;
      color: #111;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
      transform: translateY(-2px);
    }

    /* ── WAVE ANIMATION ── */
    .wave_anim .wave {
      display: inline-block;
      opacity: 0;
      animation: wave 1.1s ease-out forwards
    }

    @keyframes wave {
      0% {
        transform: translateY(25px);
        opacity: 0
      }

      100% {
        transform: translateY(0);
        opacity: 1
      }
    }

    .wave_anim.custom .wave:nth-child(1) {
      animation-delay: .15s
    }

    .wave_anim.custom .wave:nth-child(2) {
      animation-delay: .3s
    }

    .wave_anim.custom .wave:nth-child(3) {
      animation-delay: .45s
    }

    /* ── PROGRESS BAR ── */
    .progress-container {
      position: absolute;
      bottom: 80px;
      left: 5%;
      right: 5%;
      height: 4px;
      display: flex;
      gap: 10px;
      z-index: 3;
      width: 150px;
    }

    .progress-segment {
      flex: 1;
      background: rgba(255, 255, 255, .25);
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: #fff;
      display: block
    }

    .wheel_down {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      opacity: .7;
      z-index: 3;
      animation: wheel-bounce 2s ease-in-out infinite;
    }

    .wheel_down .wheel {
      animation: wheel-fade 2s ease-in-out infinite;
    }

    @keyframes wheel-fade {
      0% {
        opacity: 1;
        transform: translateY(0)
      }

      80% {
        opacity: .2;
        transform: translateY(10px)
      }

      100% {
        opacity: 0;
        transform: translateY(14px)
      }
    }

    #sidebar {
      display: none
    }
  </style>

      }

    <style>
      /* ───────────────────────────────────────────────
     공통 · 레이아웃
  ───────────────────────────────────────────────*/
      .sub-visual__wrap {
        position: relative;
        z-index: 2;
        height: 80vh;
        width: 100%;
        background-size: cover !important;
        background-position: center top !important;
        overflow: hidden;
        perspective: 900px;
        --reveal-dur: 900ms;
      }

      .sub-visual__wrap.visual-01 {
        background: url(./img/navi/ph.svg) no-repeat center top;
      }

      .sub-visual__wrap[class*="visual"]::before {
        z-index: 1;
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(110deg, rgba(18, 22, 34, .56)45%, rgba(28, 33, 54, .34)100%);
        pointer-events: none;
        transition: background .8s;
      }

      /* ▼ 중앙에서 바깥쪽으로 '열리며' 배경이 나타나는 리빌 패널 */
      .sub-visual__wrap .reveal {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        background: #0b0d12;
        z-index: 0;
        transform: translateX(0);
        will-change: transform;
      }

      .sub-visual__wrap .reveal.l {
        left: 0;
      }

      .sub-visual__wrap .reveal.r {
        right: 0;
      }

      .sub-visual__wrap.play .reveal.l {
        animation: revealOutL var(--reveal-dur) cubic-bezier(.22, .8, .18, 1) forwards;
      }

      .sub-visual__wrap.play .reveal.r {
        animation: revealOutR var(--reveal-dur) cubic-bezier(.22, .8, .18, 1) forwards;
      }

      @keyframes revealOutL {
        to {
          transform: translateX(-100%);
        }
      }

      @keyframes revealOutR {
        to {
          transform: translateX(100%);
        }

<script>
(function(){
    var section = document.querySelector("#youtubeVideoSection");
    if(!section || section.__htuInit) return;
    section.__htuInit = true;

    function htuCms(){
        if(window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
        if(!window.__htuCmsP){
            window.__htuCmsP = (window.HTU_I18N ? window.HTU_I18N.ready : Promise.resolve()).then(function () { return fetch(String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + (window.HTU_I18N ? window.HTU_I18N.q('/api/public/content') : '/api/public/content'), { credentials: 'omit' }); })
                .then(function(r){ return r.ok ? r.json() : null; })
                .catch(function(){ return null; });
        }
        return window.__htuCmsP;
    }
    function esc(s){
        return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
            return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
        });
    }
    var ICON = {
        popup: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
        link: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7.5 16.5 16.5 7.5M9 7.5h7.5V15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    htuCms().then(function(data){
        data = data || {};
        var st = (data.settings && data.settings.publications) || {};
        var items = data.publications || [];
        if(!items.length){ section.style.display = 'none'; return; }
        render(st, items);
        initModal(items);
        initFade();
    });

    function render(st, items){
        var title = section.querySelector('[data-cms="title"]');
        if(title) title.textContent = st.title || '정기 출간물';
        var popupLabel = st.popup_label || '자세히 보기';
        var linkLabel = st.link_label || '바로가기';

        section.querySelector('.yvs-grid').innerHTML = items.map(function(it, i){
            var action = it.action || 'link';
            if(action === 'link' && !it.link_url) action = 'none';
            var label = action === 'popup' ? popupLabel : linkLabel;
            var ind = action === 'none' ? '' :
                '<span class="yvs-ind" data-kind="' + action + '" aria-hidden="true">' + ICON[action] + '</span>';
            var cta = action === 'none' ? '' :
                '<span class="yvs-cta" data-kind="' + action + '">' + esc(label) + ICON[action] + '</span>';
            var inner =
                '<div class="yvs-image" data-border="' + esc(it.image_border || 'none') + '">' +
                    '<img src="' + esc(it.cover_url) + '" alt="' + esc(it.caption) + '" loading="lazy" decoding="async">' + ind +
                '</div>' +
                '<div class="yvs-caption"><span>' + esc(it.caption) + '</span>' + cta + '</div>';

            var hit;
            if(action === 'link'){
                hit = '<a class="yvs-hit" href="' + esc(it.link_url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc((it.caption || '') + ' ' + label) + '">' + inner + '</a>';
            }else if(action === 'popup'){
                hit = '<button type="button" class="yvs-hit" data-idx="' + i + '" aria-label="' + esc((it.caption || '') + ' ' + label) + '">' + inner + '</button>';
            }else{
                hit = '<div class="yvs-hit is-static">' + inner + '</div>';
            }
            return '<div class="yvs-card fadeItem">' + hit + '</div>';
        }).join('');
    }

    function initModal(items){
        var modal = section.querySelector('.yvs-modal');
        var img = modal.querySelector('.yvs-m-cover img');
        var t = modal.querySelector('.yvs-m-title');
        var d = modal.querySelector('.yvs-m-desc');
        var btn = modal.querySelector('.yvs-m-btn');
        var last = null;

        function open(it){
            last = document.activeElement;
            img.src = it.cover_url || ''; img.alt = it.caption || '';
            t.textContent = it.popup_title || it.caption || '';
            d.textContent = it.popup_desc || '';
            d.style.display = it.popup_desc ? '' : 'none';
            if(it.link_url){
                btn.style.display = ''; btn.href = it.link_url;
                btn.textContent = (it.button_label || '홈페이지 바로가기') + ' ↗';
            }else{ btn.style.display = 'none'; }
            modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false');
            document.documentElement.style.overflow = 'hidden';
            modal.querySelector('.yvs-m-close').focus({ preventScroll:true });
        }
        function close(){
            modal.classList.remove('is-open'); modal.setAttribute('aria-hidden','true');
            document.documentElement.style.overflow = '';
            if(last && last.focus) last.focus({ preventScroll:true });
        }
        section.querySelectorAll('.yvs-hit[data-idx]').forEach(function(b){
            b.addEventListener('click', function(){ open(items[+b.getAttribute('data-idx')]); });
        });
        modal.querySelector('.yvs-m-close').addEventListener('click', close);
        modal.addEventListener('click', function(e){ if(e.target === modal) close(); });
        document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && modal.classList.contains('is-open')) close(); });
    }

    /* 등장 애니메이션 (원본 로직) */
    function initFade(){
        var items = section.querySelectorAll(".fadeItem");
        var isActive = false;
        var rafId = null;

        function setActive(nextState){
            if(isActive === nextState) return;
            isActive = nextState;
            if(rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(function(){
                items.forEach(function(el){ el.classList.toggle("active", isActive); });
            });
        }
        function check(){
            var rect = section.getBoundingClientRect();
            var vh = window.innerHeight || document.documentElement.clientHeight;
            setActive(rect.top < vh * 0.88 && rect.bottom > vh * 0.12);
        }
        if('IntersectionObserver' in window){
            new IntersectionObserver(function(entries){
                entries.forEach(function(entry){

  <script>
    (function () {

      function htuCms() {

      function getYoutubeId(url) {
        if (!url) return '';

        if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
        var m = str.match(/youtu\.be\/([^?&/]+)/i); if (m && m[1]) return m[1];

      function init(items, st) {

          var btn = node.querySelector('.slide-btn');

            var s = buildSlide(item);

        function setTrackHeightFrom(el) {

          if (isMobile() || isAnimating || pageCount < 2) return;
          transitionToPage(currentPage >= pageCount - 1 ? 0 : currentPage + 1, 1);
        }
        function prev() {
          if (isMobile() || isAnimating || pageCount < 2) return;
          transitionToPage(currentPage <= 0 ? pageCount - 1 : currentPage - 1, -1);
        }
        function stopAuto() { if (autoTimer) clearInterval(autoTimer); autoTimer = null; }
        function startAuto() {
          stopAuto();
          if (isMobile() || interval <= 0) return;
          autoTimer = setInterval(function () { if (!isAnimating) next(); }, interval);
        }
        function onMore() { mobileVisibleCount += 5; renderMobile(); }

        function openPopup(videoId, title) {
          popupFrame.src = getEmbedUrl(videoId);
          popup.classList.add('is-open');
          popup.setAttribute('aria-hidden', 'false');
          if (title) popupFrame.setAttribute('title', title);
          document.documentElement.style.overflow = 'hidden';
          stopAuto();
        }
        function closePopup() {
          popup.classList.remove('is-open');
          popup.setAttribute('aria-hidden', 'true');
          popupFrame.src = '';
          document.documentElement.style.overflow = '';
        }

        function onPointerDown(e) {
          if (isMobile() || isAnimating) return;
          dragStartX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          isDragging = true;
          dragMoved = false;
        }
        function onPointerMove(e) {
          if (!isDragging || isMobile()) return;
          var x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          if (Math.abs(x - dragStartX) > 12) dragMoved = true;
        }
        function onPointerUp(e) {
          if (!isDragging || isMobile() || isAnimating) return;
          var endX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX) || 0;
          var diff = endX - dragStartX;
          if (Math.abs(diff) > 60) { if (diff < 0) next(); else prev(); }
          isDragging = false;
          setTimeout(function () { dragMoved = false; }, 0);
        }

        if (btnPrev) btnPrev.addEventListener('click', prev);
        if (btnNext) btnNext.addEventListener('click', next);
        if (moreBtn) moreBtn.addEventListener('click', onMore);
        if (popupClose) popupClose.addEventListener('click', closePopup);
        popup.addEventListener('click', function (e) { if (e.target === popup) closePopup(); });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && popup.classList.contains('is-open')) closePopup();
        });
        section.addEventListener('mouseenter', stopAuto);
        section.addEventListener('mouseleave', startAuto);
        track.addEventListener('mousedown', onPointerDown);
        track.addEventListener('mousemove', onPointerMove);
        track.addEventListener('touchstart', onPointerDown, { passive: true });
        track.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchend', onPointerUp);

        var resizeTimer = null;
        var wasMobile = isMobile();
        window.addEventListener('resize', function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            var nowMobile = isMobile();
            if (nowMobile && !wasMobile) mobileVisibleCount = 5;
            wasMobile = nowMobile;
            isAnimating = false;
            render();
            startAuto();
          }, 120);
        });

        render();
        startAuto();
      }
    })();
  </script>
</section>
